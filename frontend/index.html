<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive internship board for students and freshers"
    >

    <title>Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>Internship Board</h1>
            <p>Find internships and start building your career.</p>
        </div>
    </header>


    <main class="container">

        <!-- Search and Filters -->
        <section class="search-section" aria-labelledby="search-title">

            <h2 id="search-title">Find an Internship</h2>

            <form id="searchForm" class="filters">

                <div class="form-group">
                    <label for="searchInput">
                        Search internships
                    </label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search by title, company or domain"
                        autocomplete="off"
                    >
                </div>


                <div class="form-group">
                    <label for="domainFilter">
                        Select Domain
                    </label>

                    <select id="domainFilter">

                        <option value="all">
                            All Domains
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Cybersecurity">
                            Cybersecurity
                        </option>

                        <option value="Cloud Computing">
                            Cloud Computing
                        </option>

                        <option value="Java Development">
                            Java Development
                        </option>

                    </select>
                </div>


                <button
                    type="button"
                    id="clearBtn"
                    class="clear-button"
                >
                    Clear Filters
                </button>

            </form>

        </section>


        <!-- Internship Results -->
        <section
            class="results-section"
            aria-labelledby="results-title"
        >

            <div class="results-header">

                <h2 id="results-title">
                    Available Internships
                </h2>

                <p id="resultCount" aria-live="polite"></p>

            </div>


            <!-- Error message -->
            <div
                id="errorMessage"
                class="message error"
                role="alert"
                hidden
            ></div>


            <!-- Empty state -->
            <div
                id="emptyMessage"
                class="message empty"
                hidden
            >

                <h3>No internships found</h3>

                <p>
                    Try changing your search or domain filter.
                </p>

            </div>


            <!-- Internship cards -->
            <div
                id="internshipList"
                class="internship-grid"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            © 2026 Internship Board
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
